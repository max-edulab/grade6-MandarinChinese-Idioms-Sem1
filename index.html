<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- 主畫面（max-edulab 入口）用的標籤：主畫面會讀這些 meta 來顯示、搜尋、排序 -->
<meta name="edulab:title" content="成語小學堂">
<meta name="edulab:stage" content="國小六年級">
<meta name="edulab:subject" content="國語">
<meta name="edulab:tags" content="成語,近義詞,反義詞,成語填空,上學期">
<meta name="edulab:desc" content="四個人一起玩成語牌：看題目出意思相近、相反或填進句子的成語，還能抓別人出錯的牌，先拿到 50 分就贏。">
<meta name="edulab:icon" content="📜">
<meta name="description" content="四個人一起玩成語牌：看題目出意思相近、相反或填進句子的成語，還能抓別人出錯的牌，先拿到 50 分就贏。">
<title>成語小學堂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1f7a4a; --felt2:#186a3e; --ink:#1b1b2f; --paper:#fffbe8; --brick:#c84c0c; --gold:#fcbc3c; --leaf:#3c9c28; --muted:#6a6a80; --red:#c8283c;
  --f-zy:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-px:"Press Start 2P",ui-monospace,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#123d28;color:var(--ink);font-family:var(--f-zy);display:flex;flex-direction:column;min-height:100vh}
button{font:inherit;color:inherit}

/* ---------- 上方 bar ---------- */
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px;background:var(--ink);color:#fff;border-bottom:4px solid #000}
.bar h1{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
.bar .px{font-family:var(--f-px);font-size:10px;color:var(--gold)}
.bar .btns{display:flex;gap:8px}
.bar a,.bar button{font-size:14px;font-weight:700;color:var(--ink);background:var(--paper);border:3px solid #000;padding:3px 10px;text-decoration:none;cursor:pointer}

/* ---------- 牌桌 ---------- */
.table{flex:1;display:grid;grid-template-columns:170px minmax(0,1fr) 170px;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding:12px;
  background:radial-gradient(ellipse at center,var(--felt) 0%,var(--felt2) 70%,#145a34 100%);max-width:1240px;width:100%;margin:0 auto}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;position:relative}
.seat.top{grid-column:2;grid-row:1}
.seat.left{grid-column:1;grid-row:2;justify-content:center}
.seat.right{grid-column:3;grid-row:2;justify-content:center}
.who{display:inline-flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);padding:3px 10px 3px 4px;border-radius:999px;font-weight:900;color:#fff}
.who .av{width:32px;height:32px;display:grid;place-items:center;font-size:20px;background:#fff;border-radius:50%;border:2px solid var(--ink)}
.who .pts{font-weight:900;color:var(--gold)}
.seat.turn .who,.me.turn .who{background:var(--gold);color:var(--ink);border-color:var(--ink);box-shadow:0 0 0 3px rgba(252,188,60,.45)}
.seat.turn .who .pts,.me.turn .who .pts{color:var(--brick)}
.loot{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;font-size:20px;min-height:24px;max-width:160px}
.loot span{filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.backs{display:flex;justify-content:center;align-items:center;gap:6px;font-family:var(--f-px);font-size:10px;color:#fff}
.back{width:22px;height:32px;border-radius:3px;border:2px solid #fff;background:repeating-linear-gradient(45deg,#a0202e 0 4px,#c8283c 4px 8px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.slot{min-height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.passtag{font-weight:900;background:#e8e8f0;color:var(--muted);border:3px solid var(--ink);border-radius:10px;padding:2px 12px}
.waittag{font-size:13px;color:rgba(255,255,255,.7)}
.catch{font-weight:900;font-size:14px;background:var(--red);color:#fff;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);border-radius:8px;padding:1px 10px;cursor:pointer}
.catch:active{transform:translateY(3px);box-shadow:none}
.mark{font-size:13px;font-weight:900;padding:1px 8px;border-radius:999px;border:2px solid var(--ink);white-space:nowrap}
.mark.ok{background:#d4f4c8;color:#1f6a1a}.mark.no{background:#ffd8d8;color:var(--red)}.mark.got{background:#fff3b0;color:var(--brick)}

/* 中間：題目 */
.center{grid-column:2;grid-row:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
.qcard{width:min(580px,100%);background:var(--paper);border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.35);padding:14px 18px;text-align:center}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.qtype{display:inline-block;font-size:14px;font-weight:900;color:#fff;padding:2px 10px;border-radius:999px}
.qtype.syn{background:#2c64d8}.qtype.ant{background:var(--red)}.qtype.fill{background:#7a4ac8}
.qno{font-size:13px;font-weight:700;color:var(--muted)}
.qtext{font-size:clamp(18px,2.4vw,24px);font-weight:900;line-height:1.6}
.qtext .key{font-family:var(--f-serif);color:var(--brick);font-size:1.15em}
.qsent{margin-top:4px;font-size:clamp(17px,2.2vw,22px);line-height:1.7;font-family:var(--f-serif);font-weight:700}
.qsent .blank{display:inline-block;min-width:4.4em;border-bottom:3px solid var(--brick);color:var(--brick)}
.qhint{margin-top:6px;font-size:13px;color:var(--muted);font-weight:700}
.phase{width:min(580px,100%);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;color:#fff;font-weight:900;text-align:center}
.phase .msg{background:rgba(0,0,0,.4);padding:4px 14px;border-radius:999px;line-height:1.5}
.phase .ans{background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;font-family:var(--f-serif)}
.phase .ans b{font-family:var(--f-zy);color:var(--brick)}
.nextbtn{font-weight:900;font-size:16px;background:var(--gold);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:5px 16px;border-radius:8px;cursor:pointer}
.nextbtn:active{transform:translateY(4px);box-shadow:none}

/* 牌面 */
.card{position:relative;width:62px;height:102px;flex:none;border-radius:8px;border:3px solid var(--ink);background:linear-gradient(#fffdf4,#f6ecd0);box-shadow:0 4px 0 rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:transform .12s}
.card::before{content:"";position:absolute;inset:4px;border:1.5px solid #d4b878;border-radius:5px;pointer-events:none}
.card .w{writing-mode:vertical-rl;font-family:var(--f-serif);font-weight:900;font-size:20px;letter-spacing:.06em;color:var(--ink)}
.card.sm{width:52px;height:86px}.card.sm .w{font-size:17px}
.card.ok{border-color:#2f8a1e;box-shadow:0 0 0 4px #7cd060,0 4px 0 rgba(0,0,0,.35)}
.card.no{border-color:var(--red);box-shadow:0 0 0 4px #ff9aa0,0 4px 0 rgba(0,0,0,.35)}
.card.new{animation:pop .4s steps(4)}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

/* 你 */
.me{grid-column:1/-1;grid-row:3;display:grid;grid-template-columns:170px minmax(0,1fr) 170px;gap:10px;align-items:end}
.me .mine{display:flex;flex-direction:column;align-items:center;gap:6px}
.me .mid{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.me-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
.status{min-height:30px;font-weight:900;color:#fff;background:rgba(0,0,0,.35);padding:3px 14px;border-radius:999px}
.status.turn{background:var(--gold);color:var(--ink)}
.passbtn{font-weight:900;font-size:16px;background:#e8e8f0;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:5px 18px;border-radius:8px;cursor:pointer}
.passbtn:disabled{opacity:.45;cursor:default}
.passbtn:not(:disabled):active{transform:translateY(4px);box-shadow:none}
.hand{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;max-width:100%}
.hand .card:hover{transform:translateY(-8px)}
.hand.myturn .card{box-shadow:0 4px 0 rgba(0,0,0,.35),0 0 0 3px var(--gold)}
.shelf{display:flex;flex-direction:column;align-items:center;gap:4px;background:rgba(0,0,0,.3);border:2px dashed rgba(255,255,255,.35);border-radius:12px;padding:6px 10px;color:#fff;min-width:150px}
.shelf b{font-size:13px}
.shelf .loot{font-size:28px;max-width:none}
.shelf .goal{font-size:12px;color:rgba(255,255,255,.75)}

/* 解釋視窗、結果、得到獎勵 */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,20,15,.6)}
.ov[hidden]{display:none}
.panel{width:min(480px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--paper);border:4px solid var(--ink);border-radius:14px;box-shadow:0 8px 0 rgba(0,0,0,.35);padding:20px 22px;text-align:center}
.panel h2{margin:0 0 4px;font-family:var(--f-serif);font-size:40px;font-weight:900;letter-spacing:.1em;color:var(--brick)}
.panel .sec{text-align:left;margin-top:12px}
.panel .sec b{display:inline-block;font-size:13px;color:#fff;background:var(--ink);padding:1px 8px;border-radius:999px;margin-bottom:4px}
.panel .sec p{margin:0;font-size:17px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-serif);font-weight:700;font-size:15px;padding:1px 8px;border:2px solid var(--ink);border-radius:6px;background:#fff}
.chip.syn{background:#dbe8ff}.chip.ant{background:#ffe0e4}
.row{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{font-weight:900;font-size:17px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:8px 22px;border-radius:8px;cursor:pointer;background:#fff}
.btn.go{background:var(--leaf);color:#fff}
.btn:active{transform:translateY(4px);box-shadow:none}
.rank{list-style:none;margin:12px 0 0;padding:0;text-align:left;font-size:17px;font-weight:700}
.rank li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-bottom:2px dashed #d8d2b8}
.rules{text-align:left;font-size:16px;line-height:1.8;margin:10px 0 0;padding-left:1.2em}
.toast{position:fixed;left:50%;top:70px;translate:-50% 0;z-index:30;background:var(--paper);border:4px solid var(--ink);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.35);padding:10px 18px;font-weight:900;font-size:18px;display:flex;align-items:center;gap:10px;animation:pop .4s steps(4)}
.toast .big{font-size:40px}
.toast[hidden]{display:none}

@media (max-width:760px){
  .table{grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto auto;padding:8px;gap:8px}
  .seat.top,.seat.left,.seat.right{grid-row:1}
  .seat.left{grid-column:1}.seat.top{grid-column:2}.seat.right{grid-column:3}
  .who{font-size:13px;padding:2px 8px 2px 2px}.who .av{width:26px;height:26px;font-size:16px}
  .loot{font-size:15px}
  .slot{min-height:96px}
  .center{grid-column:1/-1;grid-row:2}
  .me{grid-row:3;grid-template-columns:minmax(0,1fr)}
  .me .mine{order:-1;flex-direction:row;justify-content:center;flex-wrap:wrap}
  .shelf{flex-direction:row;min-width:0}
  .shelf .loot{font-size:22px}
  .card{width:52px;height:88px}.card .w{font-size:17px}
  .card.sm{width:44px;height:74px}.card.sm .w{font-size:14px}
  .bar{padding:6px 10px}.bar h1{font-size:16px;white-space:nowrap}.bar .px{display:none}
  .bar .btns{gap:4px}.bar a,.bar button{font-size:12px;padding:2px 6px;border-width:2px;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar">
  <h1><span class="px">GRADE 6</span>📜 成語小學堂</h1>
  <div class="btns"><button type="button" id="helpBtn">玩法</button><button type="button" id="newBtn">重新開始</button><a href="https://max-edulab.github.io/home/">主畫面</a></div>
</header>
<main class="table">
  <section class="seat top" id="seat2"></section>
  <section class="seat left" id="seat1"></section>
  <section class="seat right" id="seat3"></section>
  <section class="center">
    <div class="qcard" id="qcard"></div>
    <div class="phase" id="phase"></div>
  </section>
  <section class="me" id="me">
    <div class="mine" id="mine"></div>
    <div class="mid">
      <div class="me-top"><span class="status" id="status"></span><button type="button" class="passbtn" id="passBtn">Pass 不出</button></div>
      <div class="hand" id="hand"></div>
    </div>
    <div class="shelf" id="shelf"></div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<div class="ov" id="ov" hidden><div class="panel" id="panel"></div></div>
<script>
/* ================= 成語資料 =================
   每一組是意思相近的成語（5 張牌），opp 是意思相反的那一組；
   keys 是出題用的成語（不會變成牌），fill 是每張牌都填得進去的句子（＿ 的地方填成語）。 */
const GROUPS = [
  { id:'focus', name:'專心', opp:'unfocus', keys:['全心全意', '心無二用'],
    fill:['考試時，他＿地寫考卷，完全沒注意到窗外的聲音。', '姊姊＿地練習鋼琴，連媽媽叫她吃飯都沒聽見。'],
    cards:[
      ['一心一意', '心思專注在一件事上，沒有別的念頭。', '他一心一意想當醫生，每天都認真讀書。'],
      ['聚精會神', '集中精神，非常專心。', '大家聚精會神地看著台上的表演。'],
      ['全神貫注', '把全部的精神都集中在一件事上。', '射箭時要全神貫注，才能射中靶心。'],
      ['專心致志', '一心一意，集中心力去做。', '他專心致志地研究昆蟲，成了小小昆蟲專家。'],
      ['心無旁騖', '心思集中，不被其他事情吸引。', '下棋時她心無旁騖，一點也不受旁人影響。']] },
  { id:'unfocus', name:'不專心', opp:'focus', keys:['心猿意馬', '心神不定'],
    fill:['上課時他＿，老師剛剛說了什麼都不知道。', '寫作業時他總是＿，所以寫了很久都寫不完。'],
    cards:[
      ['三心二意', '心意不專一，一下想這樣、一下想那樣。', '做事不能三心二意，才會做得好。'],
      ['心不在焉', '心思不在這裡，不專心。', '他上課心不在焉，老師叫了兩次都沒聽到。'],
      ['漫不經心', '隨隨便便，不把事情放在心上。', '他漫不經心地回答問題，結果答錯了。'],
      ['魂不守舍', '心神不定，精神不集中。', '小狗走失後，妹妹整天魂不守舍。'],
      ['東張西望', '到處看來看去，不專心。', '考試時不可以東張西望。']] },
  { id:'happy', name:'高興', opp:'sad', keys:['心花怒放', '喜氣洋洋'],
    fill:['聽到明天要去遊樂園，弟弟＿，開心得不得了。', '比賽得了第一名，全班同學都＿。'],
    cards:[
      ['興高采烈', '心情非常高興，興致很高。', '聽到要去遠足，同學們興高采烈。'],
      ['歡天喜地', '非常高興的樣子。', '過年時，小朋友歡天喜地地領紅包。'],
      ['眉開眼笑', '眉毛舒展、眼睛帶笑，形容很高興。', '奶奶看到孫子回家，笑得眉開眼笑。'],
      ['手舞足蹈', '高興得手腳都跳起舞來。', '弟弟拿到新玩具，高興得手舞足蹈。'],
      ['喜出望外', '遇到意想不到的好事，特別高興。', '收到朋友寄來的禮物，她喜出望外。']] },
  { id:'sad', name:'難過', opp:'happy', keys:['鬱鬱寡歡', '心灰意冷'],
    fill:['考試沒考好，他＿地走回家。', '比賽輸了以後，隊員們一整天都＿。'],
    cards:[
      ['垂頭喪氣', '因為失敗或不順利，低著頭、沒有精神。', '球隊輸了，隊員們垂頭喪氣地走回休息室。'],
      ['無精打采', '精神不好，提不起勁。', '他昨晚沒睡好，今天一整天都無精打采。'],
      ['灰心喪氣', '遇到困難或失敗，失去了信心。', '一次失敗不要灰心喪氣，再試一次就好。'],
      ['悶悶不樂', '心裡不痛快，不開心。', '好朋友轉學了，她一直悶悶不樂。'],
      ['愁眉苦臉', '皺著眉頭、苦著臉，很憂愁的樣子。', '功課太多，弟弟愁眉苦臉地坐在書桌前。']] },
  { id:'panic', name:'慌張', opp:'calm', keys:['不知所措', '張皇失措'],
    fill:['突然停電了，大家＿，不知道該怎麼辦。', '第一次上台表演，他緊張得＿。'],
    cards:[
      ['手忙腳亂', '做事慌張，沒有條理。', '早上起晚了，他手忙腳亂地穿衣服。'],
      ['手足無措', '慌張得不知道該怎麼辦。', '老師突然點他回答，他手足無措。'],
      ['驚慌失措', '害怕慌張，不知道怎麼辦才好。', '聽到火災警報，大家驚慌失措。'],
      ['六神無主', '心慌意亂，拿不定主意。', '找不到回家的路，他急得六神無主。'],
      ['慌慌張張', '匆忙又緊張的樣子。', '他慌慌張張地跑進教室，差點跌倒。']] },
  { id:'calm', name:'冷靜', opp:'panic', keys:['處變不驚', '好整以暇'],
    fill:['地震發生時，老師＿地帶著大家躲到桌子下。', '比賽只剩最後十秒，他還是＿地把球投進籃框。'],
    cards:[
      ['從容不迫', '不慌不忙，非常鎮定。', '面對突發狀況，老師從容不迫地指揮大家。'],
      ['不慌不忙', '不慌張、不急躁。', '雖然快遲到了，他還是不慌不忙地吃完早餐。'],
      ['泰然自若', '遇到事情很鎮定，跟平常一樣。', '即使大家都很緊張，她仍然泰然自若。'],
      ['氣定神閒', '神情鎮定安閒，一點也不緊張。', '上台演講時，他氣定神閒地看著台下。'],
      ['鎮定自若', '遇到緊急情況，態度鎮定，跟平常一樣。', '警報響起時，班長鎮定自若地帶大家排隊。']] },
  { id:'careful', name:'認真仔細', opp:'careless', keys:['一板一眼', '精雕細琢'],

    cards:[

const CARDS = GROUPS.flatMap(g => g.cards.map(([w, m, ex]) => ({ w, m, ex, g:g.id })));
const groupOf = id => GROUPS.find(g => g.id === id);

/* ================= 規則設定 ================= */
const PLAYERS = [{ name:'你', av:'🙂' }, { name:'小美', av:'👧' }, { name:'阿哲', av:'👦' }, { name:'小安', av:'🧒' }];
const HAND = 10, WIN = 50, RIGHT_PTS = 5, CATCH_PTS = 1, CHECK_SEC = 10;
const AI = { play:.7, bluff:.2, catch:.35 };   // 有對的牌時出牌的機會、沒有時亂出的機會、看到錯牌去抓的機會
const LOOT = [['🐶', '小狗'], ['🐱', '小貓'], ['🐰', '兔子'], ['🐹', '倉鼠'], ['🦊', '狐狸'], ['🐼', '熊貓'], ['🐢', '烏龜'], ['🦜', '鸚鵡'],
  ['🎈', '氣球'], ['🪁', '風箏'], ['🏆', '獎盃'], ['👑', '皇冠'], ['🚲', '腳踏車'], ['⚽', '足球'], ['🎸', '吉他'], ['🌟', '星星']];

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const nm = i => i === 0 ? '你' : PLAYERS[i].name;
let G = null, timers = [];
const later = (fn, ms) => { const t = setTimeout(fn, ms); timers.push(t); return t; };
const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };

// 音效
let actx = null;
function beep(f, d, t = 'triangle', v = .06, when = 0){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const n = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = t; o.frequency.value = f; g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(.0001, n + d); o.connect(g); g.connect(actx.destination); o.start(n); o.stop(n + d + .02); } catch (e) {}
}
const SFX = { play:() => beep(520, .08, 'square', .04), ok:() => [660, 880, 1100].forEach((f, i) => beep(f, .12, 'triangle', .06, i * .08)), no:() => { beep(220, .2, 'sawtooth', .04); beep(160, .25, 'sawtooth', .04, .15); },
  pass:() => beep(330, .08, 'sine', .05), catch:() => [880, 660].forEach((f, i) => beep(f, .1, 'square', .05, i * .09)), loot:() => [784, 988, 1175, 1568].forEach((f, i) => beep(f, .1, 'square', .05, i * .07)),
  win:() => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => beep(f, .16, 'square', .045, i * .13)) };

/* ================= 開始、出題 ================= */
function newGame(){
  clearTimers();
  const deck = shuffle(CARDS.slice());
  G = { hands:[0, 1, 2, 3].map(() => deck.splice(0, HAND)), deck, disc:[], score:[0, 0, 0, 0], loot:[[], [], [], []], round:0, start:Math.floor(Math.random() * 4),
    q:null, phase:'play', order:[], oi:0, played:[null, null, null, null], left:0, over:false };
  newRound();
}
function draw(){
  if (!G.deck.length){ G.deck = shuffle(G.disc); G.disc = []; }
  return G.deck.pop();
}
// 挑一組：大家手上加起來至少有兩張對的牌，大部分時候你手上也有
function makeQ(){
  const cnt = GROUPS.map(g => ({ g, all:G.hands.flat().filter(c => c.g === g.id).length, mine:G.hands[0].filter(c => c.g === g.id).length }));
  let pool = cnt.filter(x => x.all >= 2 && (Math.random() < .75 ? x.mine >= 1 : true));
  if (!pool.length) pool = cnt.filter(x => x.all >= 1);
  const g = pick(pool).g, type = pick(['syn', 'ant', 'fill']);
  return { g:g.id, type, p:type === 'syn' ? pick(g.keys) : type === 'ant' ? pick(groupOf(g.opp).keys) : pick(g.fill) };
}
const isRight = (card, q) => card.g === q.g;
function newRound(){
  G.round++; G.q = makeQ(); G.phase = 'play'; G.played = [null, null, null, null];
  G.order = [0, 1, 2, 3].map(k => (G.start + k) % 4); G.start = (G.start + 1) % 4; G.oi = 0;
  nextActor();
}

/* ================= 出牌：每人輪一次，出一張或 Pass ================= */
const actor = () => G.phase === 'play' && G.oi < 4 ? G.order[G.oi] : -1;
function nextActor(){
  render();
  if (G.oi >= 4){ later(startCheck, 500); return; }
  const i = actor();
  if (i !== 0) later(() => aiPlay(i), 900 + Math.random() * 500);
}
function aiPlay(i){
  const hand = G.hands[i], right = hand.filter(c => isRight(c, G.q)), wrong = hand.filter(c => !isRight(c, G.q));
  if (right.length && Math.random() < AI.play) putCard(i, pick(right));
  else if (wrong.length && Math.random() < AI.bluff) putCard(i, pick(wrong));
  else { G.played[i] = { pass:true }; SFX.pass(); G.oi++; nextActor(); }
}
function putCard(i, card){
  G.hands[i] = G.hands[i].filter(c => c !== card);
  G.played[i] = { card, caught:-1 };
  const nw = draw(); G.hands[i].push(nw); if (i === 0) G.fresh = nw;   // 每丟一張牌，馬上補一張
  SFX.play(); G.oi++; nextActor();
}

/* ================= 檢查時間：可以抓別人出錯的牌 ================= */
function startCheck(){
  const any = G.played.some(p => p && p.card);
  if (!any){ reveal(); return; }
  G.phase = 'check'; G.left = CHECK_SEC;
  // 電腦家：看到別人出錯牌，有機會去抓
  G.played.forEach((p, i) => {
    if (!p || !p.card || isRight(p.card, G.q)) return;
    [1, 2, 3].filter(j => j !== i).forEach(j => { if (Math.random() < AI.catch) later(() => doCatch(j, i), 2000 + Math.random() * 6000); });
  });
  tick();
}
function tick(){
  if (G.phase !== 'check') return;
  render();
  if (G.left <= 0){ reveal(); return; }
  later(() => { G.left--; tick(); }, 1000);
}
function doCatch(by, i){
  const p = G.played[i];
  if (G.phase !== 'check' || !p || !p.card || p.caught >= 0) return;
  if (!isRight(p.card, G.q)){
    p.caught = by; G.score[by] += CATCH_PTS; SFX.catch();
    flash(`${PLAYERS[by].av} ${nm(by)}抓到${nm(i)}出錯牌「${p.card.w}」！+${CATCH_PTS} 分`);
    gainLoot(by);
  } else if (by === 0){
    // 你抓錯了：這張其實是對的
    p.falseCatch = true; G.score[0] = Math.max(0, G.score[0] - 1); SFX.no();
    flash(`「${p.card.w}」是對的，抓錯了！扣 1 分`);
  }
  render();
}

/* ================= 公布答案、算分、補牌 ================= */
function reveal(){
  clearTimers();
  G.phase = 'reveal';
  G.played.forEach((p, i) => {
    if (!p || !p.card) return;
    if (isRight(p.card, G.q)){ p.ok = true; G.score[i] += RIGHT_PTS; G.disc.push(p.card); }
    else { p.ok = false; G.hands[i].push(p.card); }   // 錯的牌收回去（等於多拿一張）
  });
  const anyRight = G.played.some(p => p && p.ok);
  if (anyRight) SFX.ok(); else SFX.pass();
  [0, 1, 2, 3].forEach(gainLoot);
  render();
  const top = Math.max(...G.score);
  if (top >= WIN){ later(finish, 2200); return; }
  later(nextRoundAfterReveal, 9000);
}
function nextRoundAfterReveal(){
  if (G.phase !== 'reveal' || G.over) return;
  clearTimers();
  newRound();
}
// 每 10 分得到一個道具或寵物
function gainLoot(i){
  while (G.loot[i].length < Math.min(5, Math.floor(G.score[i] / 10))){
    const owned = G.loot[i].map(x => x[0]), opts = LOOT.filter(x => !owned.includes(x[0])), it = pick(opts);
    G.loot[i].push(it);
    if (i === 0){ SFX.loot(); showToast(`<span class="big">${it[0]}</span><span>你得到了「${it[1]}」！<br><small>${G.score[0]} 分</small></span>`); }
  }
}
function finish(){
  clearTimers(); G.over = true; G.phase = 'over';
  const order = [0, 1, 2, 3].sort((a, b) => G.score[b] - G.score[a]), win = order[0];
  if (win === 0) SFX.win(); else SFX.no();
  render();
  showOv(`<h2 style="font-size:30px">${win === 0 ? '🎉 你贏了！' : `${PLAYERS[win].av} ${PLAYERS[win].name}贏了`}</h2>
    <p style="margin:6px 0 0;font-size:17px">${win === 0 ? '你最先拿到 50 分，真厲害！' : '再試一次，看看你能不能最先拿到 50 分！'}</p>
    <ol class="rank">${order.map(k => `<li><span>${PLAYERS[k].av} ${PLAYERS[k].name}</span><span>${G.loot[k].map(x => x[0]).join('')}</span><span>${G.score[k]} 分</span></li>`).join('')}</ol>
    <div class="row"><button class="btn go" data-new>再玩一次</button></div>`);
}

/* ================= 畫面 ================= */
const cardHtml = (c, cls = '', attr = '') => `<button type="button" class="card ${cls}" ${attr} aria-label="${esc(c.w)}"><span class="w">${esc(c.w)}</span></button>`;
function slotHtml(i){
  const p = G.played[i];
  if (!p) return G.phase === 'play' && actor() === i ? '<span class="waittag">想一想…</span>' : '';
  if (p.pass) return '<span class="passtag">Pass</span>';
  const c = p.card;
  let cls = 'sm new', tag = '';
  if (G.phase === 'reveal' || G.phase === 'over'){
    cls += p.ok ? ' ok' : ' no';
    tag = p.ok ? `<span class="mark ok">答對 +${RIGHT_PTS}</span>` : p.caught >= 0 ? `<span class="mark got">被${nm(p.caught)}抓到</span>` : '<span class="mark no">出錯了</span>';
  } else if (p.caught >= 0){
    cls += ' no'; tag = `<span class="mark got">被${nm(p.caught)}抓到！</span>`;
  } else if (G.phase === 'check' && i !== 0 && !p.falseCatch){
    tag = `<button type="button" class="catch" data-catch="${i}">抓！</button>`;
  } else if (p.falseCatch) tag = '<span class="mark ok">抓錯了</span>';
  return cardHtml(c, cls, `data-look="${esc(c.w)}"`) + tag;
}
const lootHtml = i => `<div class="loot">${G.loot[i].map(x => `<span title="${x[1]}">${x[0]}</span>`).join('')}</div>`;
function render(){
  if (!G) return;
  const now = actor();
  [1, 2, 3].forEach(i => {
    const el = $('seat' + i);
    el.className = el.className.replace(/\bturn\b/g, '').trim() + (now === i ? ' turn' : '');
    el.innerHTML = `<span class="who"><span class="av">${PLAYERS[i].av}</span>${PLAYERS[i].name}<span class="pts">⭐${G.score[i]}</span></span>${lootHtml(i)}
      <div class="backs"><span class="back"></span>×${G.hands[i].length}</div><div class="slot">${slotHtml(i)}</div>`;
  });
  // 題目
  const q = G.q, g = groupOf(q.g);
  const head = `<div class="qhead">${q.type === 'syn' ? '<span class="qtype syn">意思相近</span>' : q.type === 'ant' ? '<span class="qtype ant">意思相反</span>' : '<span class="qtype fill">成語填空</span>'}<span class="qno">第 ${G.round} 題</span></div>`;
  $('qcard').innerHTML = head + (q.type === 'fill'
    ? `<div class="qtext">句子裡的空格可以填哪一個成語？</div><div class="qsent">${esc(q.p).replace('＿', '<span class="blank">？</span>')}</div>`
    : `<div class="qtext">找出和 <span class="key">「${esc(q.p)}」</span> 意思${q.type === 'syn' ? '相近' : '相反'}的成語</div>`)
    + '<div class="qhint">答案不只一個，很多人都可以出牌！</div>';
  // 中間的提示
  let ph = '';
  if (G.phase === 'play') ph = `<span class="msg">${now === 0 ? '輪到你了！' : now > 0 ? `${nm(now)}正在想…` : '大家都出完了，準備檢查…'}</span>`;
  else if (G.phase === 'check') ph = `<span class="msg">🔍 檢查時間：發現有人出錯牌，按「抓！」可以得 ${CATCH_PTS} 分（${G.left}）</span><button type="button" class="nextbtn" data-reveal>公布答案</button>`;
  else if (G.phase === 'reveal' || G.phase === 'over') ph = `<span class="ans"><b>這題的答案：</b>${g.cards.map(c => c[0]).join('、')}</span>${G.phase === 'reveal' && Math.max(...G.score) < WIN ? '<button type="button" class="nextbtn" data-next>下一題 ▶</button>' : ''}`;
  $('phase').innerHTML = ph;
  // 你
  $('me').classList.toggle('turn', now === 0);
  $('mine').innerHTML = `<span class="who"><span class="av">${PLAYERS[0].av}</span>你<span class="pts">⭐${G.score[0]}</span></span><div class="slot">${slotHtml(0)}</div>`;
  $('shelf').innerHTML = `<b>我的收藏</b>${lootHtml(0)}<span class="goal">每 10 分得到一個，${WIN} 分就贏</span>`;
  $('hand').className = 'hand' + (now === 0 ? ' myturn' : '');
  $('hand').innerHTML = G.hands[0].map(c => cardHtml(c, c === G.fresh ? 'new' : '', `data-w="${esc(c.w)}"`)).join('');
  G.fresh = null;
  $('status').className = 'status' + (now === 0 ? ' turn' : '');
  $('status').textContent = G.over ? '遊戲結束' : now === 0 ? '點一張牌看解釋、出牌，或按 Pass' : G.phase === 'check' ? '可以點別人的牌看解釋，發現錯了就按「抓！」' : G.phase === 'reveal' ? '看看大家出的牌對不對' : now > 0 ? `等${nm(now)}出牌…` : '準備檢查…';
  $('passBtn').disabled = now !== 0;
}

/* ================= 提示、視窗 ================= */
let toastT = null;
function showToast(html){ const t = $('toast'); t.innerHTML = html; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const flash = text => showToast(`<span>${esc(text)}</span>`);
const ov = $('ov');
function showOv(html){ $('panel').innerHTML = html; ov.hidden = false; const f = $('panel').querySelector('.btn'); if (f) f.focus(); }
function hideOv(){ ov.hidden = true; }
function explain(card, canPlay){
  const g = groupOf(card.g), o = groupOf(g.opp);
  const syn = [...g.cards.map(c => c[0]).filter(w => w !== card.w), ...g.keys], ant = [...o.cards.map(c => c[0]), ...o.keys];
  showOv(`<h2>${esc(card.w)}</h2>
    <div class="sec"><b>解釋</b><p>${esc(card.m)}</p></div>
    <div class="sec"><b>例句</b><p>${esc(card.ex)}</p></div>
    <div class="sec"><b>意思相近</b><div class="chips">${syn.map(s => `<span class="chip syn">${esc(s)}</span>`).join('')}</div></div>
    <div class="sec"><b>意思相反</b><div class="chips">${ant.map(s => `<span class="chip ant">${esc(s)}</span>`).join('')}</div></div>
    <div class="row">${canPlay ? `<button class="btn go" data-play="${esc(card.w)}">出這張牌</button>` : ''}<button class="btn" data-close>結束</button></div>`);
}
const RULES = `<h2 style="font-size:30px">玩法</h2>
  <ol class="rules">
    <li>你和小美、阿哲、小安每人有 10 張成語牌。</li>
    <li>中間出題目：找<b>意思相近</b>、<b>意思相反</b>的成語，或<b>填進句子</b>的成語。答案不只一個！</li>
    <li>每一題大家輪流，每人可以出一張牌，也可以按「Pass」。點牌可以先看解釋。</li>
    <li>大家都出完後是<b>檢查時間</b>：點別人的牌看解釋，發現出錯了就按「抓！」，抓到得 1 分（抓錯扣 1 分）。</li>
    <li>每丟一張牌，就會馬上再補一張。公布答案時，出對的牌得 5 分；出錯的牌要收回去（手上會多一張）。</li>
    <li>每 10 分得到一個道具或寵物，誰先拿到 <b>50 分</b>誰就贏！</li>
  </ol>
  <div class="row"><button class="btn go" data-close>開始玩</button></div>`;

$('hand').addEventListener('click', e => {
  const b = e.target.closest('[data-w]'); if (!b || !G) return;
  const card = G.hands[0].find(c => c.w === b.dataset.w);
  if (card) explain(card, actor() === 0);
});
document.querySelector('.table').addEventListener('click', e => {
  const look = e.target.closest('[data-look]'); if (look){ explain(CARDS.find(c => c.w === look.dataset.look), false); return; }
  const c = e.target.closest('[data-catch]'); if (c){ doCatch(0, +c.dataset.catch); return; }
  if (e.target.closest('[data-reveal]') && G.phase === 'check'){ reveal(); return; }
  if (e.target.closest('[data-next]')) nextRoundAfterReveal();
});
$('panel').addEventListener('click', e => {
  if (e.target.closest('[data-close]')){ hideOv(); return; }
  if (e.target.closest('[data-new]')){ hideOv(); newGame(); return; }
  const p = e.target.closest('[data-play]');
  if (p && actor() === 0){ const card = G.hands[0].find(c => c.w === p.dataset.play); hideOv(); if (card) putCard(0, card); }
});
ov.addEventListener('click', e => { if (e.target === ov && !G.over) hideOv(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !ov.hidden && !G.over) hideOv(); });
$('passBtn').addEventListener('click', () => { if (actor() === 0){ hideOv(); G.played[0] = { pass:true }; SFX.pass(); G.oi++; nextActor(); } });
$('newBtn').addEventListener('click', () => { hideOv(); newGame(); });
$('helpBtn').addEventListener('click', () => showOv(RULES));

newGame();
showOv(RULES);
</script>
</body>
</html>
