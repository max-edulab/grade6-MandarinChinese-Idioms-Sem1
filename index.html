<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--sky:#5c94fc;--ink:#1b1b2f;--paper:#fffbe8;--brick:#c84c0c;--leaf:#3c9c28;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--sky);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif}
.card{max-width:520px;width:100%;background:var(--paper);border:4px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.25);padding:28px 24px;text-align:center}
.px{font-family:"Press Start 2P",monospace;font-size:12px;color:var(--brick)}
h1{margin:10px 0 6px;font-size:30px;font-weight:900}
.chips{display:flex;justify-content:center;gap:6px;margin:10px 0 16px}
.chip{font-size:13px;font-weight:700;padding:2px 8px;border:2px solid var(--ink);background:#ffe08a}
.chip.s{background:#bfe8c0}
p{line-height:1.7;margin:0 0 18px}
.big{font-size:56px;line-height:1}
a{display:inline-block;font-weight:900;color:#fff;background:var(--leaf);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:6px 16px;text-decoration:none}
</style>
</head>
<body>
  <div class="card">
    <div class="big" aria-hidden="true">📜</div>
    <div class="px">COMING SOON</div>
    <h1>成語小學堂</h1>
